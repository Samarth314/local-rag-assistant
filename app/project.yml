name: ATARU
options:
  bundleIdPrefix: com.ataru.client
  # iOS 18, raised from 17 on 2026-08-16.
  #
  # Bought for one thing: `onScrollGeometryChange`, which is what lets a tile
  # screen read its own page's scroll offset from the outside and so claim a
  # downward drag ONLY at scroll top - the standard sheet rule. Under 17 that
  # was unreachable, the drag had to be confined to a grab bar, and every tile
  # screen therefore needed a visible X to close it. Every device in this
  # fleet runs 18.3 or later, so the floor costs nothing and removes the
  # chrome.
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
# Signing comes from Signing.xcconfig, which optionally includes the
# gitignored Config.xcconfig. Keeping it out of this file means regenerating
# the project never wipes the team ID you set — and never commits it either.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
# WhisperKit (Argmax, MIT) runs Whisper on the Neural Engine via CoreML. It is
# here for ONE reason Apple's recogniser cannot match: prompt biasing, which
# makes proper nouns the assistant already knows ("Saikat Chaudhuri") likely
# instead of mangled ("psych").
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ATARU:
    type: application
    platform: iOS
    sources:
      - path: ATARU
    dependencies:
      - package: WhisperKit
    settings:
      base:
        INFOPLIST_FILE: ATARU/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(ATARU_BUNDLE_ID_PREFIX).ATARU
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        SUPPORTS_MACCATALYST: "NO"
  ATARUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ATARUTests
    dependencies:
      - target: ATARU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATARU_BUNDLE_ID_PREFIX).ATARUTests
        GENERATE_INFOPLIST_FILE: "YES"
  ATARUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ATARUITests
    dependencies:
      - target: ATARU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATARU_BUNDLE_ID_PREFIX).ATARUITests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  ATARU:
    build:
      targets:
        ATARU: all
        ATARUTests: [test]
        ATARUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ATARUTests
        - ATARUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
