# Containerized RAG assistant: app + Ollama on a private network.
# Isolation properties:
#   - documents are mounted READ-ONLY (the app cannot modify or delete them)
#   - the app runs as a non-root user with no host access
#   - index/state/models live in named volumes; `docker compose down -v`
#     removes every trace
#
# Usage:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen2.5:14b-instruct
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct-64k   # expansion model
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose run --rm rag python cli.py index /docs
#   docker compose run --rm rag python cli.py query "..." --timing
#
# Set DOCS_DIR to choose what's indexed, e.g.:
#   DOCS_DIR=$HOME/Documents docker compose run --rm rag python cli.py index /docs

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Keep models resident instead of unloading after ~5 min idle -- the
      # 64GB Orin fits the whole lineup (7B + 20B + embed, ~17GB) with room
      # to spare, and cold reloads were costing 20-40s on first queries.
      OLLAMA_KEEP_ALIVE: "-1"
      # Let the concurrent route+expand calls actually overlap instead of
      # queueing behind each other.
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ollama-models:/root/.ollama
    # --- Jetson GPU access: uncomment on the Orin (JetPack includes the
    # --- NVIDIA container runtime). Without this Ollama runs CPU-only.
    # runtime: nvidia

  rag:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      RAG_DATA_DIR: /data
      # Tiered models (Jetson defaults; the 64GB Orin keeps all resident):
      #   fast tier = 7B, thorough tier (--good / auto-routed) = gpt-oss:20b
      RAG_CHAT_MODEL: qwen2.5:7b-instruct
      RAG_GOOD_MODEL: gpt-oss:20b
      # --- Alternative local engine: vLLM (OpenAI-compatible). To use it,
      # --- run vLLM (see docker-compose.vllm.yml) and uncomment these,
      # --- setting the model names to what your vLLM server serves:
      # RAG_ENGINE: vllm
      # RAG_VLLM_URL: http://vllm:8000/v1
      # RAG_CHAT_MODEL: Qwen/Qwen2.5-7B-Instruct
      # RAG_EMBED_MODEL: nomic-ai/nomic-embed-text-v1.5
      # Cloud escalation (--deep) is inert without a key. Put the key in a
      # local .env file next to this compose file (gitignored, never
      # committed) -- Compose loads it automatically and fills this in:
      #   echo "ANTHROPIC_API_KEY=sk-ant-..." > .env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - rag-data:/data
      - ${DOCS_DIR:-./sample-docs}:/docs:ro

  # The HTTP API, as a long-lived service.
  #
  # `docker compose run --rm rag python cli.py serve` works but dies with the
  # terminal that started it, which means the phone client silently loses its
  # backend every time an SSH session ends. This is the same image and the same
  # command, run detached and restarted on boot.
  #
  # Bound to 0.0.0.0 so the tailnet can reach it. That is not a public exposure
  # -- the host has no port forward, and reachability comes from Tailscale --
  # but it does mean anything already on the tailnet can query the vault.
  api:
    build: .
    depends_on:
      - ollama
    restart: unless-stopped
    command: python cli.py serve
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      RAG_DATA_DIR: /data
      RAG_CHAT_MODEL: qwen2.5:7b-instruct
      RAG_GOOD_MODEL: gpt-oss:20b
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # VoIP push, so the iPhone can ring with ATARU closed. Unset means the
      # /voip endpoints refuse with an explanation rather than half-working.
      # Put these in .env next to this file (gitignored).
      RAG_APNS_KEY_PATH: ${RAG_APNS_KEY_PATH:-}
      RAG_APNS_KEY_ID: ${RAG_APNS_KEY_ID:-}
      RAG_APNS_TEAM_ID: ${RAG_APNS_TEAM_ID:-}
      RAG_APNS_BUNDLE_ID: ${RAG_APNS_BUNDLE_ID:-}
    volumes:
      - rag-data:/data
      - ${DOCS_DIR:-./sample-docs}:/docs:ro
      # The APNs signing key, read-only and mounted at run time. It is a
      # secret and deliberately never copied into the image: anyone holding it
      # can ring this phone until the key is revoked. Defaults to an empty
      # local directory so the service still starts without one.
      - ${APNS_KEY_DIR:-./secrets}:/keys:ro

volumes:
  ollama-models:
  rag-data:
