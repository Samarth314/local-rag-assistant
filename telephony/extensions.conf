;
; ATARU dialplan.
;
; Only one extension is reachable, and it does exactly one thing: hand the call
; to the AGI bridge. There is no outbound dialling context, so a compromised
; softphone credential cannot place calls through this server.
;
[general]
static = yes
writeprotect = yes

[globals]

[ataru]
; Dial 100 from the softphone to reach the assistant.
exten => 100,1,NoOp(ATARU voice assistant)
 same  =>     n,Answer()
 same  =>     n,Set(TIMEOUT(absolute)=600)
 same  =>     n,AGI(/opt/ataru/voice_agi.py)
 same  =>     n,Hangup()

; Anything else is refused rather than silently ignored.
exten => _X.,1,NoOp(Unknown extension ${EXTEN})
 same  =>     n,Answer()
 same  =>     n,Playback(invalid)
 same  =>     n,Hangup()

exten => h,1,NoOp(ATARU call ended)
